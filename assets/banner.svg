<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img"
     aria-label="rd0/jinx — explainable duplicate warnings for pull requests from coding agents">
  <defs>
    <clipPath id="round"><rect width="1280" height="360" rx="28"/></clipPath>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#609cfc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .m { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .s { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="#08080a"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <circle cx="1210" cy="18" r="150" fill="#609cfc" opacity="0.05"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="none" stroke="#27272f"/>

  <!-- Wordmark -->
  <text class="m" x="72" y="112" font-size="76" font-weight="700" fill="#f4f4f2">
    <tspan fill="#609cfc">rd0</tspan><tspan fill="#8b8b85" font-weight="400" dx="10">/</tspan><tspan dx="10">jinx</tspan>
  </text>

  <!-- Tagline -->
  <text class="s" x="74" y="166" font-size="27" font-weight="500" fill="#c3c3bd">Explainable duplicate warnings for pull requests</text>
  <text class="s" x="74" y="202" font-size="27" font-weight="500" fill="#c3c3bd">from coding agents</text>

  <!-- The numbers -->
  <g class="m" font-size="19" font-weight="700">
    <text x="74" y="262" fill="#e4b430">6 ms<tspan fill="#8b8b85" font-weight="500" dx="9">per PR</tspan></text>
    <text x="222" y="262" fill="#e4b430">1.9<tspan fill="#8b8b85" font-weight="500" dx="9">false alarms / 100</tspan></text>
    <text x="516" y="262" fill="#e4b430">$0<tspan fill="#8b8b85" font-weight="500" dx="9">to run</tspan></text>
  </g>

  <text class="m" x="74" y="304" font-size="15" font-weight="500" fill="#609cfc" letter-spacing="1.2" opacity="0.8">CPU-ONLY · NO API KEY · GITHUB ACTION · PLAIN REASONS</text>

  <!-- The comment it leaves -->
  <g transform="translate(742,62)">
    <rect x="0" y="0" width="466" height="236" rx="6" fill="#101014" stroke="#609cfc" stroke-opacity="0.32"/>
    <rect x="0" y="0" width="466" height="40" rx="6" fill="#17171d"/>
    <rect x="0" y="30" width="466" height="10" fill="#17171d"/>
    <line x1="0" y1="40" x2="466" y2="40" stroke="#609cfc" stroke-opacity="0.22"/>

    <g class="m">
      <text x="20" y="26" font-size="15" font-weight="700" fill="#609cfc">jinx<tspan font-weight="500" fill="#8b8b85" dx="10">bot</tspan></text>
      <text x="446" y="26" font-size="15" font-weight="700" fill="#e4b430" text-anchor="end">score 1.00</text>

      <text x="20" y="74" font-size="16" font-weight="500" fill="#f4f4f2">This PR may duplicate <tspan font-weight="700" fill="#609cfc">#44110</tspan></text>

      <g font-size="14" font-weight="500" fill="#c3c3bd">
        <text x="20" y="110">· one PR links to the other (#44110)</text>
        <text x="20" y="140">· shares 1 of 1 changed files</text>
        <text x="20" y="170">· 100% of changed line ranges overlap</text>
        <text x="20" y="200">· 100% of added lines are identical</text>
      </g>
    </g>
  </g>
</svg>
